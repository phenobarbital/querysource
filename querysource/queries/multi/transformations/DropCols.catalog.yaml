# Companion documentation for the ``DropCols`` transform (class: DropCols).
#
# Blacklist column selector: drop columns matching any selector. Five optional
# selectors, at least one required (matches are unioned). PluckCols is the
# whitelist twin; FilterCols filters by data content instead of name.
#
# After editing run ``generate-multiquery-docs`` (the pre-commit hook does this).

display_name: DropCols
category: Transformations
icon: shuffle

description: >-
  Drop the columns matching any of the provided selectors (blacklist by column
  name).

usage: >-
  Provide at least one of ``columns`` (exact names), ``pattern`` (glob),
  ``regex``, ``startswith`` or ``endswith``. Matches from every selector are
  unioned and removed. Exact names in ``columns`` that are not present are
  silently ignored.

attributes:
  - name: columns
    type: list
    required: false
    default: null
    description: >-
      Exact column names to drop. Missing columns are silently ignored.
    schema:
      $ref: '#/$defs/stringList'
      description: Exact column names to drop.
  - name: pattern
    type: str
    required: false
    default: null
    description: 'Glob/fnmatch pattern to match column names (e.g. "debug_*").'
  - name: regex
    type: str
    required: false
    default: null
    description: 'Regular expression to match column names (e.g. "^tmp_.*$").'
  - name: startswith
    type: list
    required: false
    default: null
    description: Drop columns whose name starts with any of these prefixes.
    schema:
      $ref: '#/$defs/stringList'
      description: Prefixes; columns starting with any are dropped.
  - name: endswith
    type: list
    required: false
    default: null
    description: Drop columns whose name ends with any of these suffixes.
    schema:
      $ref: '#/$defs/stringList'
      description: Suffixes; columns ending with any are dropped.

schema:
  title: DropCols
  description: >-
    Drop columns matching any selector. At least one selector is required.
  additionalProperties: true
  anyOf:
    - required: [columns]
    - required: [pattern]
    - required: [regex]
    - required: [startswith]
    - required: [endswith]
  defs:
    stringList:
      type: array
      items:
        type: string

example: |-
  {"Transform": [{"DropCols": {"columns": ["internal_id", "debug_flag"]}}]}
